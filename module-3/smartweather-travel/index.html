<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Weather & Travel Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="clear">
  <main class="app">
    <h1>Smart Weather & Travel Dashboard</h1>

    <form id="search-form" novalidate>
      <input id="city-input" type="text" placeholder="Search a city, e.g. Chennai" autocomplete="off" aria-label="City name">
      <button type="submit">Search</button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>

    <section id="dashboard" hidden>
      <div class="card current">
        <h2 id="city-name"></h2>
        <div class="main-row">
          <span id="icon" class="icon" aria-hidden="true"></span>
          <span id="temp" class="temp"></span>
        </div>
        <p id="condition" class="condition"></p>
        <dl class="details">
          <div><dt>Feels like</dt><dd id="feels"></dd></div>
          <div><dt>Humidity</dt><dd id="humidity"></dd></div>
          <div><dt>Wind</dt><dd id="wind"></dd></div>
        </dl>
      </div>

      <div class="card tip">
        <h3>Travel suggestion</h3>
        <p id="travel-tip"></p>
      </div>

      <h3 class="forecast-title">5-day forecast</h3>
      <div id="forecast" class="forecast"></div>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
