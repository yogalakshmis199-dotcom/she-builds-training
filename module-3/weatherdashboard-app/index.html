<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Weather Dashboard</h1>

    <form id="search-form" novalidate>
      <input id="city-input" type="text" placeholder="Search a city, e.g. Chennai" autocomplete="off" aria-label="City name">
      <button type="submit">Search</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <section id="weather" class="card" hidden>
      <h2 id="city-name"></h2>
      <div class="main-row">
        <span id="icon" class="icon" aria-hidden="true"></span>
        <span id="temp" class="temp"></span>
      </div>
      <p id="condition" class="condition"></p>
      <dl class="details">
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
      </dl>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
